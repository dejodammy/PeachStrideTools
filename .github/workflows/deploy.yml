name: Deploy to VPS

# Replicates Render's convenience: push to master, the server pulls and restarts.
# Requires three repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST — the server's IP or hostname
#   SSH_USER — "app"
#   SSH_KEY  — the PRIVATE half of a keypair whose public half is in
#              /home/app/.ssh/authorized_keys on the server
on:
  push:
    branches: [master]
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: bash ~/PeachStrideTools/deploy/deploy.sh
